<!DOCTYPE html>
<html>

<head>

    <title>Candidate Profile</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

    <h1>Candidate Profile</h1>

    <div class="profile-card">

        <div class="row">
            <label>Name</label>
            <p id="candidate-name"></p>
        </div>

        <div class="row">
            <label>Email</label>
            <p id="candidate-email"></p>
        </div>

        <div class="row">
            <label>Phone</label>
            <p id="candidate-phone"></p>
        </div>

        <div class="row">
            <label>Skills</label>
            <div id="candidate-skills" class="skills"></div>
        </div>

        <div class="row">
            <label>Education</label>
            <div id="candidate-education"></div>
        </div>

        <div class="row">
            <label>Experience</label>
            <div id="candidate-experience"></div>
        </div>

    </div>

</div>

<script src="/static/candidate.js"></script>

</body>

</html>
